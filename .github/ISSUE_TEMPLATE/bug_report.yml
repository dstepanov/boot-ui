name: Bug report
description: Report a bug in BootUI
labels: [ bug, triage ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill in the
        information below so we can reproduce and fix the issue quickly.
  - type: input
    id: bootui-version
    attributes:
      label: BootUI version
      placeholder: "0.1.0-SNAPSHOT"
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: BootUI adapter
      options:
        - Spring MVC
        - Spring WebFlux
        - Quarkus
    validations:
      required: true
  - type: input
    id: framework-version
    attributes:
      label: Spring Boot or Quarkus version
      description: Use the framework version for the selected adapter.
      placeholder: "Spring Boot 4.1.0 or Quarkus 3.33.3.1"
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "17"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behaviour you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Provide a minimal repro. Include the relevant starter/extension, configuration, and active profile or launch mode.
      placeholder: |
        1. Add the Spring MVC starter, Spring WebFlux starter, or Quarkus extension
        2. Run with a local Spring profile or in Quarkus dev mode
        3. Open the configured BootUI path
        4. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack traces
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues before opening this report.
          required: true
