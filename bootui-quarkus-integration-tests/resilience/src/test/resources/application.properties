# Random test port to avoid parallel-build collisions — see
# bootui-quarkus-integration-tests/base/src/test/resources/application.properties for why.
quarkus.http.test-port=0

quarkus.application.name=bootui-quarkus-resilience-it

# MicroProfile Fault Tolerance configuration overrides. BootUiQuarkusResilienceTest asserts that the panel
# reports the overridden value (not the annotation's) with CONFIGURED provenance, and that a policy turned off
# through the MicroProfile `enabled` switch is reported as disabled rather than shown as if it still applied.
com.example.resilience.InventoryClient/exportReport/Timeout/value=5000
com.example.resilience.InventoryClient/rebuildIndex/Bulkhead/enabled=false
