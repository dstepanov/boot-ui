# Random test port to avoid parallel-build collisions — see
# bootui-quarkus-integration-tests/base/src/test/resources/application.properties for why.
quarkus.http.test-port=0

quarkus.application.name=bootui-quarkus-cache-it
# Enable Micrometer metrics for the Caffeine cache used by the test, so the engine CacheService overlays real
# cache.gets/puts/size meters onto the report (the cache-metrics half of the panel). The JVM/system base meter
# binders are disabled to keep the registry focused and fast.
quarkus.cache.caffeine."orders".metrics-enabled=true
quarkus.micrometer.binder.jvm=false
quarkus.micrometer.binder.system=false

# Configured Caffeine limits for the 'orders' cache. The panel reads these through MicroProfile Config, so this
# is also the end-to-end check that the quoted per-cache key form resolves and that Quarkus' own duration
# spelling (5M = five minutes) is phrased the same way the Spring adapter phrases it.
quarkus.cache.caffeine."orders".maximum-size=1000
quarkus.cache.caffeine."orders".expire-after-write=5M
