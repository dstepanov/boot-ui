micronaut.application.name=bootui-micronaut-sample-app
micronaut.server.port=8080

# BootUI activates automatically in the dev, local and test environments. This sample declares dev as its
# default environment in its main class (Micronaut resolves environments before it reads this file), so
# `mvn exec:exec` starts with the console live and a production run leaves it dark.

# Real health indicators for the console's Health panel.
endpoints.health.enabled=true
endpoints.health.details-visible=ANONYMOUS

# The console is local-only by default; nothing here widens that.
bootui.expose-values=MASKED
