# Every test in this module boots the sample application under @MicronautTest. The sample itself pins
# micronaut.server.port=8080 so `mvn exec:exec` is predictable, but under test that fixed port is shared by
# every test class, and a server from the previous class may not have released it yet when the next one
# starts -- which surfaced as a flaky "Port *:8080 already in use" startup error. Micronaut loads this file
# only in the deduced `test` environment, so tests bind a random free port and the sample keeps 8080 for
# a real run. The conformance runners set the same property explicitly; this makes it the module default.
micronaut.server.port=-1
